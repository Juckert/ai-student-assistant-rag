networks:
  ai-net:
    driver: bridge

volumes:
  ollama_models:
  hf_cache:
  lancedb_data:
  shared_uploads:
  index_store:
  backend_db:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks: [ai-net]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    # Раскомментировать для GPU inference (требуется nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    networks: [ai-net]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama pull qwen3:8b; do echo 'retrying...'; sleep 3; done"]
    restart: "no"

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile.rag-api
    container_name: rag-api
    networks: [ai-net]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    volumes:
      - lancedb_data:/app/lancedb
      - shared_uploads:/app/shared_uploads
      - index_store:/app/index_store
      - backend_db:/app/backend
      - hf_cache:/root/.cache/huggingface
    environment:
      OLLAMA_HOST: http://ollama:11434
      RAG_CONFIG_MODE: default
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend
    networks: [ai-net]
    depends_on:
      rag-api:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - shared_uploads:/app/shared_uploads
      - index_store:/app/index_store
      - backend_db:/app/backend
    environment:
      OLLAMA_HOST: http://ollama:11434
      RAG_API_URL: http://rag-api:8001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistant
    networks: [ai-net]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    environment:
      BACKEND_URL: http://backend:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
