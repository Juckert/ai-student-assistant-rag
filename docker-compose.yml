networks:
  ai-net:
    driver: bridge

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks: [ai-net]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    # Uncomment to enable GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Downloads qwen2.5:7b into the ollama server on first run, then exits.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    networks: [ai-net]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Retry loop in case DNS resolves slightly after the healthcheck passes
    entrypoint: ["/bin/sh", "-c", "until ollama pull qwen2.5:7b; do echo 'retrying...'; sleep 3; done"]
    restart: "no"

  assistant:
    build: .
    container_name: assistant
    networks: [ai-net]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./db:/app/db
      - hf_cache:/root/.cache/huggingface
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: qwen2.5:7b
      EMBEDDING_MODEL_NAME: intfloat/multilingual-e5-base
      FALLBACK_EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
    # Tests run at every startup via entrypoint.sh (output visible in docker-compose logs).
    # Healthcheck re-runs them periodically; output is redirected to container stdout
    # so it appears in `docker logs assistant`.
    healthcheck:
      test: ["CMD-SHELL", "python -m pytest /app/tests/ -v --tb=short > /proc/1/fd/1 2>&1"]
      interval: 300s
      timeout: 60s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  ollama_models:
  hf_cache:
