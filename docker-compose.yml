networks:
  ai-net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    networks: [ai-net]
    environment:
      POSTGRES_USER: ai_assistant
      POSTGRES_PASSWORD: ai_assistant_pass
      POSTGRES_DB: ai_assistant_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_assistant -d ai_assistant_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks: [ai-net]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    networks: [ai-net]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        until ollama pull qwen3:8b; do echo 'retrying qwen3:8b...'; sleep 3; done
        until ollama pull qwen3:0.6b; do echo 'retrying qwen3:0.6b...'; sleep 3; done
    restart: "no"

  assistant:
    build: ./core
    container_name: assistant
    networks: [ai-net]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./core/data:/app/data
      - lancedb:/app/lancedb
      - index_store:/app/index_store
      - hf_cache:/root/.cache/huggingface
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_BACKEND: ollama
      DATABASE_URL: postgresql://ai_assistant:ai_assistant_pass@postgres:5432/ai_assistant_db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  ollama_models:
  hf_cache:
  lancedb:
  index_store:
  postgres_data:
